User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Egress allowlist for session containers (see filter.list). Sessions on
# the internal network have no other way out — this is the only bridge.
Filter "/etc/tinyproxy/filter.list"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

MaxClients 100
DisableViaHeader Yes
